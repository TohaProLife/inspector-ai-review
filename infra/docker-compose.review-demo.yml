# Add after docker-compose.yml and the provider overlay for the isolated reviewer demo.
# The one-shot migration remains stopped after it succeeds.
services:
  postgres:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  clamav:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped

# Infrastructure smoke on a shared host. The default stack is CPU-only; the
# opt-in local-vlm profile uses one NVIDIA GPU. Use with docker-compose.yml,
# a distinct Compose project name and localhost-only, non-default host ports.
# Analysis release comes from INSPECTOR_ANALYSIS_PROFILE. The optional PZ-002
# OCR URL resolves only after the local document-ai container joins this network.
services:
  postgres:
    mem_limit: 768m
    cpus: 1
  rabbitmq:
    mem_limit: 768m
    cpus: 1
  redis:
    mem_limit: 256m
    cpus: 0.5
  minio:
    mem_limit: 768m
    cpus: 1
  clamav:
    mem_limit: 2g
    cpus: 1
  migrate:
    mem_limit: 1g
    cpus: 1
  api:
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
  outbox-relay:
    mem_limit: 512m
    cpus: 0.5
  worker:
    mem_limit: 384m
    cpus: 0.5
    environment:
      DOCUMENT_PROVIDER_BASE_URL: ${SMOKE_DOCUMENT_AI_URL:-}
      OCR_LAYOUT_PROFILE_ID: ${SMOKE_OCR_LAYOUT_PROFILE_ID:-}
      PZ002_MAX_OCR_PAGES: ${PZ002_MAX_OCR_PAGES:-2}
      PZ002_MAX_TABLE_PAGES: ${PZ002_MAX_TABLE_PAGES:-8}
      PZ002_MAX_TABLE_OCR_PAGES: ${PZ002_MAX_TABLE_OCR_PAGES:-2}
  document-worker:
    mem_limit: 2g
    cpus: 2
  extract-worker:
    mem_limit: 2g
    cpus: 1
    environment:
      DOCUMENT_PROVIDER_BASE_URL: ${SMOKE_DOCUMENT_AI_URL:-}
      OCR_LAYOUT_PROFILE_ID: ${SMOKE_OCR_LAYOUT_PROFILE_ID:-}
      VISUAL_VLM_BASE_URL: ${SMOKE_VISUAL_VLM_URL:-}
    networks: [default, visual-vlm-runtime]
  visual-vlm:
    profiles: [local-vlm]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:1f4b9cf58982dd4d7cc497aea31b1a456ca9a3a1f94f527d317d3fdee0d60ab6
    user: "${SMOKE_VISUAL_VLM_UID:-1000}:${SMOKE_VISUAL_VLM_GID:-1000}"
    command:
      - --model
      - /models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --threads
      - "8"
      - --parallel
      - "1"
      - --batch-size
      - "256"
      - --ubatch-size
      - "64"
      - --image-min-tokens
      - "1024"
      - --image-max-tokens
      - "2048"
      - --alias
      - inspector-qwen3vl4b-eval
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SMOKE_GPU_DEVICE:-0}
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - type: bind
        source: ${SMOKE_VISUAL_VLM_MODEL_DIR:-../model-cache/qwen3vl4b}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks: [visual-vlm-runtime]
    runtime: nvidia
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    shm_size: 1gb
    mem_limit: 6g
    memswap_limit: 10g
    cpus: 8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      start_period: 90s
      interval: 20s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  link-worker:
    mem_limit: 384m
    cpus: 0.5
  web:
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  visual-vlm-runtime:
    internal: true

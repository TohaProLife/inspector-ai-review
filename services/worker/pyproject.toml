[project]
name = "inspector-ai-worker"
version = "0.1.0"
description = "Document processing worker for Inspector AI"
requires-python = ">=3.11"
dependencies = ["pika>=1.3.2,<2", "pdfminer.six==20260107", "PyMuPDF==1.27.2.2"]

[project.scripts]
inspector-worker = "inspector_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspector_worker"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "rules"
"inspector_worker/matrix-policy-history-v3.json" = "inspector_worker/matrix-policy-history-v3.json"

[tool.hatch.build.targets.sdist]
include = ["inspector_worker", "rules", "tests", "pyproject.toml"]
